{% extends 'base.html' %}

{% block title %}Recupera password - App Cocktail{% endblock %}

{% block content %}
<div class="auth-split">
  <div class="auth-brand">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="logo" class="auth-brand-logo">
    <h2 class="auth-brand-title">App Cocktail</h2>
    <p class="auth-brand-sub">Ti invieremo un link via email per reimpostare la password.</p>
  </div>
  <div class="auth-form-panel">
    <h1 class="auth-form-title">Password dimenticata?</h1>
    <p class="muted" style="margin-bottom:24px">Inserisci la tua email e riceverai le istruzioni.</p>

    <form method="post">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="la-tua@email.com" required autofocus>
      <button class="btn auth-submit-btn" type="submit">Invia link di reset</button>
    </form>

    <div class="auth-divider"><span>oppure</span></div>
    <a class="btn secondary auth-submit-btn" href="{{ url_for('auth.login') }}" style="text-align:center">
      Torna al login
    </a>
  </div>
</div>
{% endblock %}
