{% extends 'base.html' %}

{% block title %}Nuova password - App Cocktail{% endblock %}

{% block content %}
<div class="auth-split">
  <div class="auth-brand">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="logo" class="auth-brand-logo">
    <h2 class="auth-brand-title">App Cocktail</h2>
    <p class="auth-brand-sub">Scegli una nuova password sicura per il tuo account.</p>
  </div>
  <div class="auth-form-panel">
    <h1 class="auth-form-title">Nuova password</h1>
    <p class="muted" style="margin-bottom:24px">Minimo 8 caratteri.</p>

    <form method="post">
      <label for="password">Nuova password</label>
      <input type="password" id="password" name="password" placeholder="Minimo 8 caratteri" required autofocus>

      <label for="confirm_password">Conferma password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Ripeti la password" required>

      <button class="btn auth-submit-btn" type="submit">Salva nuova password</button>
    </form>
  </div>
</div>
{% endblock %}
